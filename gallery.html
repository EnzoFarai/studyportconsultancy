<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery – Scholar Port Consultancy</title>
    <meta name="description" content="Gallery of Scholar Port Consultancy events, student send-offs, and university visits.">
    <link rel="canonical" href="https://scholarportconsultancy.github.io/gallery.html">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-hero {
            background: linear-gradient(135deg, #1A2A33, #21566E);
            color: white;
            text-align: center;
            padding: 140px 0 70px;
            margin-top: 70px;
        }
        .page-hero h1 { font-size: 2.8rem; font-weight: 800; }
        .page-hero p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin: 10px auto 0; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .gallery-item {
            background: var(--light);
            border-radius: 12px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--primary);
            border: 1px solid #f0ebe5;
            transition: var(--transition);
        }
        .gallery-item:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(33,86,110,0.08); }
        @media (max-width: 768px) {
            .page-hero h1 { font-size: 2rem; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="page-hero">
        <div class="container">
            <h1>Our Gallery</h1>
            <p>Capturing moments from our journey</p>
        </div>
    </section>

    <section style="padding: 60px 0; background: white;">
        <div class="container">
            <div class="section-title"><h2>Photo Gallery</h2><p>Coming soon – photos and videos from our events</p></div>
            <div class="gallery-grid">
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
            </div>
            <p style="text-align:center; color:var(--gray); margin-top:20px;">📸 Send us your photos and videos to be featured here!</p>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <div id="modals-placeholder"></div>

    <script src="js/header-footer.js"></script>
    <script src="js/modals.js"></script>
</body>
</html>
