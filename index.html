<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scholar Port Consultancy – Your Dream, Our Mission</title>
    <meta name="description" content="Study abroad with Scholar Port Consultancy. Apply now for scholarships up to 100%. Study in India, USA, Poland, China, Germany and more.">
    <meta name="keywords" content="study abroad, scholarships, education consultancy, study in India, study in China, MBBS abroad">
    <meta name="author" content="Scholar Port Consultancy">
    <link rel="canonical" href="https://scholarportconsultancy.github.io/index.html">
    <meta property="og:title" content="Scholar Port Consultancy – Your Dream, Our Mission">
    <meta property="og:description" content="Apply now for 50% to 100% scholarships. Study abroad with expert guidance.">
    <meta property="og:image" content="https://scholarportconsultancy.github.io/assets/images/og-image.jpg">
    <meta property="og:url" content="https://scholarportconsultancy.github.io/index.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Homepage specific styles */
        .hero {
            background: linear-gradient(135deg, #1A2A33 0%, #21566E 50%, #1A2A33 100%);
            color: white;
            text-align: center;
            padding: 150px 0 80px;
            margin-top: 70px;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212,165,116,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .hero .container { position: relative; z-index: 1; }
        .hero h1 { font-size: 3.2rem; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.5px; }
        .hero h1 span { color: var(--secondary); }
        .hero p { font-size: 1.2rem; max-width: 650px; margin: 0 auto 30px; opacity: 0.9; }
        .hero-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        /* Circular Destinations Scroll – Infinite Loop */
        .destinations-scroll-section {
            padding: 60px 0;
            background: var(--light);
        }
        .scroll-container {
            position: relative;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 55px;
            overflow: hidden;
        }
        .scroll-track-wrapper {
            overflow: hidden;
            border-radius: 32px;
            background: #ffffff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
            padding: 28px 16px;
        }
        .scroll-track {
            display: flex;
            gap: 32px;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            width: max-content;
        }
        .dest-circle {
            flex: 0 0 auto;
            text-align: center;
            user-select: none;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(.34, 1.56, .64, 1);
            width: 130px;
        }
        .dest-circle:hover { transform: translateY(-6px) scale(1.03); }
        .dest-circle .circle-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 14px;
            background: #e8ecf0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 3px solid #e9edf2;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .dest-circle:hover .circle-img {
            box-shadow: 0 6px 28px rgba(33,86,110,0.2);
            border-color: var(--secondary);
        }
        .dest-circle .circle-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .dest-circle .circle-name {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            transition: color 0.2s;
        }
        .dest-circle:hover .circle-name { color: var(--primary); }

        .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #ffffff;
            border: 2.5px solid var(--primary);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 28px;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(33,86,110,0.15);
            transition: all 0.2s;
            color: var(--primary);
            user-select: none;
            line-height: 1;
            font-weight: 300;
            padding: 0;
        }
        .scroll-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 8px 30px rgba(33,86,110,0.3);
            transform: translateY(-50%) scale(1.08);
        }
        .scroll-btn:active { transform: translateY(-50%) scale(0.92); }
        .scroll-btn.left { left: 0; }
        .scroll-btn.right { right: 0; }

        /* Welcome Section */
        .welcome-section {
            padding: 70px 0;
            background: white;
        }
        .welcome-grid {
            display: flex;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
        }
        .welcome-text { flex: 1; }
        .welcome-text h2 { font-size: 2rem; color: var(--primary); margin-bottom: 20px; }
        .welcome-text p { color: #555; margin-bottom: 15px; line-height: 1.7; }
        .welcome-card { flex: 1; background: var(--light); border-radius: 16px; padding: 40px; text-align: center; }
        .welcome-card i { font-size: 4rem; color: var(--secondary); }
        .welcome-card h3 { margin: 15px 0 5px; color: var(--primary); }
        .welcome-card p { color: var(--gray); }

        /* Programs Categorized */
        .programs-section {
            padding: 60px 0;
            background: var(--light);
        }
        .programs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 30px;
        }
        .program-category h3 {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 8px;
        }
        .program-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .program-tag {
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #e5e0d9;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--dark);
            transition: all 0.2s;
            cursor: default;
        }
        .program-tag:hover {
            border-color: var(--secondary);
            background: var(--light);
        }
        .program-tag i { color: var(--secondary); margin-right: 6px; }

        /* Why Choose */
        .why-section {
            padding: 60px 0;
            background: white;
        }
        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .why-card {
            background: var(--light);
            padding: 30px 25px;
            border-radius: 12px;
            text-align: center;
            border-top: 3px solid var(--secondary);
            transition: var(--transition);
        }
        .why-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        .why-card i { font-size: 2rem; color: var(--secondary); }
        .why-card h4 { margin: 12px 0 5px; color: var(--primary); }
        .why-card p { color: var(--gray); font-size: 0.9rem; }

        .view-all-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            transition: var(--transition);
            border: 2px solid var(--primary);
        }
        .view-all-link:hover {
            background: transparent;
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 992px) {
            .programs-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .scroll-container { padding: 0 20px; }
            .dest-circle { width: 100px; }
            .dest-circle .circle-img { width: 100px; height: 100px; }
            .dest-circle .circle-name { font-size: 15px; }
            .scroll-btn { width: 44px; height: 44px; font-size: 22px; }
            .scroll-track { gap: 24px; }
            .scroll-track-wrapper { padding: 20px 12px; }
            .welcome-grid { flex-direction: column; }
        }
        @media (max-width: 480px) {
            .scroll-container { padding: 0 12px; }
            .dest-circle { width: 80px; }
            .dest-circle .circle-img { width: 80px; height: 80px; }
            .dest-circle .circle-name { font-size: 13px; }
            .scroll-btn { width: 36px; height: 36px; font-size: 18px; }
            .scroll-track { gap: 16px; }
            .scroll-track-wrapper { padding: 16px 10px; border-radius: 20px; }
            .hero h1 { font-size: 1.6rem; }
            .welcome-card { padding: 25px; }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Your Dream, <span>Our Mission</span></h1>
            <p>Study abroad with expert guidance. Scholarships up to 100% available. A Level & O Level accepted.</p>
            <div class="hero-buttons">
                <a href="#" class="btn btn-secondary apply-now-btn" style="background:var(--secondary); border-color:var(--secondary); color:#1A2A33;">Apply Now</a>
                <a href="#" class="btn btn-primary consultation-btn" style="background:white; border-color:white; color:var(--primary);">Free Consultation</a>
            </div>
        </div>
    </section>

    <!-- Study Destinations – Circular Scroll (Infinite Loop) -->
    <section class="destinations-scroll-section">
        <div class="container">
            <div class="section-title">
                <h2>Study Destinations</h2>
                <p>Choose from our top study destinations worldwide</p>
            </div>
            <div class="scroll-container">
                <button class="scroll-btn left" id="scrollLeftBtn" aria-label="Scroll left">‹</button>
                <div class="scroll-track-wrapper">
                    <div class="scroll-track" id="destinationScroll">
                        <!-- Items will be generated by JavaScript -->
                    </div>
                </div>
                <button class="scroll-btn right" id="scrollRightBtn" aria-label="Scroll right">›</button>
            </div>
            <div style="text-align:center; margin-top:25px;">
                <a href="destinations.html" class="view-all-link">View
