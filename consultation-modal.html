<div class="modal-overlay" id="consultation-modal">
    <div class="consultation-modal">
        <div class="modal-header">
            <h2 class="modal-title">Book Free Consultation</h2>
            <button class="close-modal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form id="consultation-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="consultation-full-name" class="form-control" placeholder="e.g. John Smith" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="consultation-email" class="form-control" placeholder="e.g. john@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <div class="phone-input-group">
                        <div class="country-code-container">
                            <input type="text" id="consultation-country-code" class="form-control" placeholder="Code">
                            <div class="country-code-dropdown" id="consultation-country-code-dropdown"></div>
                        </div>
                        <div class="phone-number">
                            <input type="tel" id="consultation-phone" class="form-control" placeholder="Phone number" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Country of Residence</label>
                    <input type="text" id="consultation-country-residence" class="form-control" placeholder="e.g. Zimbabwe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Nationality</label>
                    <input type="text" id="consultation-nationality" class="form-control" placeholder="e.g. Zimbabwean" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Desired Course/Program</label>
                    <input type="text" id="consultation-course" class="form-control" placeholder="e.g. MBBS, Engineering" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Preferred Study Destination</label>
                    <div class="select-wrapper">
                        <select id="consultation-study-destination" class="form-control" required>
                            <option value="">Select destination</option>
                            <option value="India">India</option>
                            <option value="China">China</option>
                            <option value="Cyprus">Cyprus</option>
                            <option value="Poland">Poland</option>
                            <option value="Turkey">Turkey</option>
                            <option value="Germany">Germany</option>
                            <option value="Georgia">Georgia</option>
                            <option value="USA">USA</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Level of Study</label>
                    <div class="select-wrapper">
                        <select id="consultation-study-level" class="form-control" required>
                            <option value="">Select level</option>
                            <option value="Diploma">Diploma</option>
                            <option value="Bachelor's">Bachelor's</option>
                            <option value="Master's">Master's</option>
                            <option value="MBBS">MBBS</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Preferred Study Year</label>
                    <div class="select-wrapper">
                        <select id="consultation-study-year" class="form-control" required>
                            <option value="">Select year</option>
                            <option value="2026">2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Preferred Intake Month</label>
                    <div class="select-wrapper">
                        <select id="consultation-intake-month" class="form-control" required>
                            <option value="">Select month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                    </div>
                </div>
                <div class="form-footer">
                    <div class="terms-checkbox">
                        <input type="checkbox" id="consultation-terms" checked required>
                        <label for="consultation-terms">By submitting, you agree to our <a href="#">Privacy Policy</a> and <a href="#">Terms</a></label>
                    </div>
                    <button type="submit" class="submit-btn">Get Started Now</button>
                </div>
            </form>
        </div>
    </div>
</div>
